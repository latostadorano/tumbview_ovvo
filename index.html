<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tumbview</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img id="foto" alt="">
  <div id="ui">
    <div id="controls">
      <span id="label">Tumbview</span>
      <div id="inputs">
        <input id="blog" type="text" placeholder="blog name" value="toust" spellcheck="false" autocomplete="off">
        <span class="dim">.tumblr.com</span>
        <input id="time" type="number" value="10" min="1" max="120">
        <span class="dim">sec</span>
      </div>
      <div id="buttons">
        <button id="go">Go</button>
        <button id="play" disabled>▶</button>
        <button id="link" disabled title="Open on Tumblr">🔗</button>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="tumbview.js"></script>
</body>
</html>
